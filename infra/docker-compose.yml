version: "3.9"

services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../apps/api:/app
    depends_on:
      - db

  web:
    build:
      context: ../apps/web
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: localaudit
      POSTGRES_USER: localaudit
      POSTGRES_PASSWORD: localaudit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
